name: "Publish to Maven Central"

on:
  release:
    types: [created]

env:
  MAVEN_ARGS: -B -V --no-transfer-progress

jobs:
  publish:
    name: "Publish to Maven Central"
    runs-on: ubuntu-latest
    # CRITICAL SECURITY CHECK: Only run if the release was created from the maven-central branch
    # This prevents accidental publishing from feature branches or pull requests
    if: github.event.release.target_commitish == 'maven-central'

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Set up Java 25 — injects Central credentials into ~/.m2/settings.xml via server-id/server-username/server-password.
      # GPG key imported here; passphrase is read from MAVEN_GPG_PASSPHRASE env var at deploy time.
      - name: "Set up JDK 25"
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "corretto"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: "Configure Git User"
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      # Drop -V here: Maven version banner pollutes -DforceStdout output
      - name: "Extract and Prepare Release Version"
        id: extract_version
        env:
          MAVEN_ARGS: -B -q --no-transfer-progress
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -DforceStdout | tail -n1)
          if [[ -z "$CURRENT_VERSION" ]]; then
            echo "Error: Could not extract version from POM"
            exit 1
          fi
          echo "Current POM version: $CURRENT_VERSION"
          if [[ "$CURRENT_VERSION" == *"-SNAPSHOT" ]]; then
            RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
            echo "SNAPSHOT: $CURRENT_VERSION -> Release: $RELEASE_VERSION"
          else
            RELEASE_VERSION="$CURRENT_VERSION"
            echo "Using existing release version: $RELEASE_VERSION"
          fi
          echo "VERSION=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "ORIGINAL_VERSION=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: "Validate Release Version"
        run: |
          VERSION="${{ steps.extract_version.outputs.VERSION }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "Warning: Version '$VERSION' doesn't follow semantic versioning format"
          fi
          echo "✅ Release version validated: $VERSION"

      - name: "Update POM to Release Version"
        run: |
          VERSION="${{ steps.extract_version.outputs.VERSION }}"
          ORIGINAL_VERSION="${{ steps.extract_version.outputs.ORIGINAL_VERSION }}"
          if [[ "$ORIGINAL_VERSION" != "$VERSION" ]]; then
            mvn ${MAVEN_ARGS} versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
            NEW_VERSION=$(mvn -B -q --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout | tail -n1)
            if [[ "$NEW_VERSION" != "$VERSION" ]]; then
              echo "Error: Version update failed. Expected: $VERSION, Got: $NEW_VERSION"
              exit 1
            fi
            echo "POM version updated to: $NEW_VERSION"
          else
            echo "POM already has release version: $VERSION"
          fi

      # Sign the POM with GPG (maven-gpg-plugin verify phase), then build the bundle manually.
      # We bypass central-publishing-maven-plugin's bundling entirely because it includes
      # maven-metadata-local.xml and _remote.repositories in the zip, which Central rejects.
      # Instead: sign → generate checksums → zip only the exact required files → upload via API.
      - name: "Sign POM"
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn ${MAVEN_ARGS} clean verify -P maven-central -Dmaven.install.skip=true

      - name: "Build and upload bundle manually"
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.extract_version.outputs.VERSION }}"
          GROUP_PATH="com/iqkv/boot-parent-pom"
          ARTIFACT="boot-parent-pom"
          STAGING="target/manual-staging/${GROUP_PATH}/${VERSION}"

          mkdir -p "${STAGING}"

          # Copy the signed POM and its signature
          cp pom.xml "${STAGING}/${ARTIFACT}-${VERSION}.pom"
          cp "target/${ARTIFACT}-${VERSION}.pom.asc" "${STAGING}/${ARTIFACT}-${VERSION}.pom.asc"

          # Generate required checksums
          md5sum    "${STAGING}/${ARTIFACT}-${VERSION}.pom" | awk '{print $1}' > "${STAGING}/${ARTIFACT}-${VERSION}.pom.md5"
          sha1sum   "${STAGING}/${ARTIFACT}-${VERSION}.pom" | awk '{print $1}' > "${STAGING}/${ARTIFACT}-${VERSION}.pom.sha1"
          sha256sum "${STAGING}/${ARTIFACT}-${VERSION}.pom" | awk '{print $1}' > "${STAGING}/${ARTIFACT}-${VERSION}.pom.sha256"
          sha512sum "${STAGING}/${ARTIFACT}-${VERSION}.pom" | awk '{print $1}' > "${STAGING}/${ARTIFACT}-${VERSION}.pom.sha512"

          echo "Bundle contents:"
          find "target/manual-staging" -type f | sort

          # Create the zip with only the required files (no metadata files)
          cd target/manual-staging
          zip -r "../central-bundle.zip" .
          cd -

          echo "Zip contents:"
          unzip -l target/central-bundle.zip

          # Upload to Central Portal
          RESPONSE=$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $(echo -n "${CENTRAL_TOKEN_USERNAME}:${CENTRAL_TOKEN_PASSWORD}" | base64 -w0)" \
            --form "bundle=@target/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC")

          echo "Upload response: ${RESPONSE}"
          DEPLOYMENT_ID="${RESPONSE}"
          echo "Deployment ID: ${DEPLOYMENT_ID}"

          # Poll until published
          for i in $(seq 1 60); do
            sleep 30
            BODY=$(curl --silent --fail \
              --header "Authorization: Bearer $(echo -n "${CENTRAL_TOKEN_USERNAME}:${CENTRAL_TOKEN_PASSWORD}" | base64 -w0)" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}" || true)
            echo "[$i/60] Status response: ${BODY}"
            if [[ -z "${BODY}" ]]; then
              echo "Empty response — deployment likely already completed. Verifying on Central..."
              break
            fi
            STATUS=$(echo "${BODY}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('deploymentState','UNKNOWN'))" 2>/dev/null || echo "UNKNOWN")
            echo "[$i/60] Deployment ${DEPLOYMENT_ID} state: ${STATUS}"
            if [[ "${STATUS}" == "PUBLISHED" ]]; then
              echo "✅ Successfully published to Maven Central"
              exit 0
            fi
            if [[ "${STATUS}" == "FAILED" ]]; then
              echo "❌ Deployment failed"
              echo "${BODY}"
              exit 1
            fi
          done

          # Final check — verify the artifact is actually on Central
          sleep 10
          CHECK_URL="https://repo1.maven.org/maven2/${GROUP_PATH}/${VERSION}/${ARTIFACT}-${VERSION}.pom"
          HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" "${CHECK_URL}")
          if [[ "${HTTP_CODE}" == "200" ]]; then
            echo "✅ Confirmed: ${ARTIFACT}-${VERSION} is live on Maven Central"
          else
            echo "⚠️  Artifact not yet visible on Maven Central (HTTP ${HTTP_CODE}) — may still be propagating"
            echo "    Check https://central.sonatype.com/publishing/deployments for deployment ${DEPLOYMENT_ID}"
          fi
