name: "Publish to Maven Central"

on:
  release:
    types: [created]

env:
  MAVEN_ARGS: -B -V --no-transfer-progress

jobs:
  publish:
    name: "Publish to Maven Central"
    runs-on: ubuntu-latest
    # CRITICAL SECURITY CHECK: Only run if the release was created from the maven-central branch
    # This prevents accidental publishing from feature branches or pull requests
    if: github.event.release.target_commitish == 'maven-central'

    steps:
      # Get the source code from the repository
      - name: "Checkout Repository"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Set up Java 25 — also injects Central credentials into ~/.m2/settings.xml
      # server-username/server-password map to the env vars exported at the deploy step
      - name: "Set up JDK 25"
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "corretto"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Configure Git for potential version commits
      - name: "Configure Git User"
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      # Extract version from POM and convert SNAPSHOT to release version
      # MAVEN_ARGS overridden locally to drop -V: the version banner would pollute -DforceStdout output
      - name: "Extract and Prepare Release Version"
        id: extract_version
        env:
          MAVEN_ARGS: -B -q --no-transfer-progress
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -DforceStdout | tail -n1)
          if [[ -z "$CURRENT_VERSION" ]]; then
            echo "Error: Could not extract version from POM"
            exit 1
          fi

          echo "Current POM version: $CURRENT_VERSION"

          if [[ "$CURRENT_VERSION" == *"-SNAPSHOT" ]]; then
            RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
            echo "SNAPSHOT: $CURRENT_VERSION -> Release: $RELEASE_VERSION"
          else
            RELEASE_VERSION="$CURRENT_VERSION"
            echo "Using existing release version: $RELEASE_VERSION"
          fi

          echo "VERSION=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "ORIGINAL_VERSION=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      # Validate the release version format
      - name: "Validate Release Version"
        run: |
          VERSION="${{ steps.extract_version.outputs.VERSION }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "Warning: Version '$VERSION' doesn't follow semantic versioning format"
          fi
          echo "✅ Release version validated: $VERSION"

      # Update POM to use the release version (strips -SNAPSHOT suffix)
      - name: "Update POM to Release Version"
        run: |
          VERSION="${{ steps.extract_version.outputs.VERSION }}"
          ORIGINAL_VERSION="${{ steps.extract_version.outputs.ORIGINAL_VERSION }}"

          if [[ "$ORIGINAL_VERSION" != "$VERSION" ]]; then
            mvn ${MAVEN_ARGS} versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
            # -q and tail -n1 to avoid any banner lines polluting the captured version
            NEW_VERSION=$(mvn -B -q --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout | tail -n1)
            if [[ "$NEW_VERSION" != "$VERSION" ]]; then
              echo "Error: Version update failed. Expected: $VERSION, Got: $NEW_VERSION"
              exit 1
            fi
            echo "POM version updated to: $NEW_VERSION"
          else
            echo "POM already has release version: $VERSION"
          fi

      # Build, sign, stage and inspect the bundle before uploading.
      # skipPublishing=true creates the bundle without uploading so we can verify contents.
      - name: "Stage artifacts"
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn ${MAVEN_ARGS} clean deploy -P maven-central -DskipPublishing=true

      - name: "Inspect bundle contents"
        run: |
          echo "=== central-staging tree ==="
          find target/central-staging -type f | sort
          echo ""
          echo "=== central-bundle.zip contents ==="
          ZIP=$(find target -name "central-bundle.zip" | head -1)
          if [[ -n "$ZIP" ]]; then
            unzip -l "$ZIP"
          else
            echo "ERROR: no central-bundle.zip found"
            exit 1
          fi

      - name: "Publish bundle to Maven Central"
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn ${MAVEN_ARGS} central-publishing:publish-bundle -P maven-central
